<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>To my dearest angel..</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{
      height:100%;width:100%;overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:transparent;
    }

    /* RADHA-KRISHNA BACKGROUND – STARTING PART */
    .bg-wrapper{
      position:fixed;inset:0;overflow:hidden;z-index:-3;
    }
    .bg-image{
      position:absolute;inset:-5%;
      background-image:url("https://scontent.fpat2-8.fna.fbcdn.net/v/t1.15752-9/622471357_1975604193390615_8500902659735836688_n.jpg?stp=dst-jpg_s960x960_tt6&_nc_cat=103&ccb=1-7&_nc_sid=9f807c&_nc_ohc=epR98qxa3hYQ7kNvwF2uUj9&_nc_oc=AdlMhYsys0gEoFm8rFrZ1s890hLk4Q_VvTR9LSjSL-q_kMp9wpsecApWijzrd0fM1Zx33k4AvTBHX9yerV1dhK75&_nc_zt=23&_nc_ht=scontent.fpat2-8.fna&oh=03_Q7cD4QGuWaFVljAaY0NSWheEu-u5oOUNkMmcHHb_X4PvAHiKgQ&oe=69A2762D");
      background-size:cover;background-position:center;background-repeat:no-repeat;
    }

    .bg-tint{
      position:fixed;inset:0;z-index:-2;
      background:radial-gradient(circle at center,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.55) 55%,
        rgba(0,0,0,0.9) 100%);
    }

    /* SNOWFALL */
    .snow-layer{
      position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden;
    }
    .snow{
      position:absolute;top:-10%;width:3px;height:3px;border-radius:50%;
      background:radial-gradient(circle,#f8ffff 0%,rgba(255,255,255,0) 70%);
      opacity:0.8;animation:fall linear infinite;
      box-shadow:0 0 8px rgba(180,230,255,0.9),0 0 16px rgba(120,200,255,0.6);
    }
    .snow:nth-child(1){left:10%;animation-duration:10s;animation-delay:0s;}
    .snow:nth-child(2){left:25%;animation-duration:12s;animation-delay:2s;}
    .snow:nth-child(3){left:40%;animation-duration:15s;animation-delay:1s;}
    .snow:nth-child(4){left:55%;animation-duration:11s;animation-delay:3s;}
    .snow:nth-child(5){left:70%;animation-duration:14s;animation-delay:0.5s;}
    .snow:nth-child(6){left:82%;animation-duration:13s;animation-delay:4s;}
    .snow:nth-child(7){left:90%;animation-duration:16s;animation-delay:1.5s;}
    .snow:nth-child(8){left:5%;animation-duration:18s;animation-delay:2.5s;}
    @keyframes fall{
      0%{transform:translate3d(0,0,0) scale(1);opacity:0;}
      10%{opacity:1;}
      50%{transform:translate3d(-10px,50vh,0) scale(1.05);}
      100%{transform:translate3d(10px,105vh,0) scale(0.9);opacity:0;}
    }

    /* YOUTUBE OVERLAY – PLAYER */
    .yt-overlay{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      z-index:3;
      transition:opacity 0.7s ease;
      background:none;
    }
    .yt-overlay.hidden{
      opacity:0;
      pointer-events:none;
    }
    .yt-container{
      width:90vw;
      max-width:420px;
      aspect-ratio:16/9;
      box-shadow:0 0 30px rgba(0,0,0,0.85);
      border-radius:18px;
      overflow:hidden;
      background:#000;
    }
    .yt-embed{
      width:100%;height:100%;border:0;
    }

    /* LETTER LAYER */
    .letter-layer{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      z-index:2;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.8s ease;
    }
    .letter-layer.visible{
      opacity:1;
      pointer-events:auto;
    }

    .letter-backdrop{
      position:fixed;inset:0;
      background:transparent;
    }

    .letter-box{
      position:relative;
      min-width:260px;
      max-width:460px;
      border-radius:24px;
      background:transparent;
      perspective:1200px;
      transform:scale(0.7);
      opacity:0;
      animation:letterBoxIn 1s cubic-bezier(0.19,1,0.22,1) forwards;
      animation-delay:0.8s;
      z-index:1;
      animation-fill-mode:forwards;
      transition:transform 0.6s ease, box-shadow 0.6s ease;
    }
    @keyframes letterBoxIn{
      0%{transform:scale(0.7);opacity:0;}
      60%{transform:scale(1.03);opacity:1;}
      100%{transform:scale(0.96);opacity:1;}
    }
    @media (hover:hover){
      .letter-box:hover{
        transform:scale(0.73);
        box-shadow:0 0 45px rgba(255,245,220,0.45);
      }
    }

    .letter-inner{
      position:relative;
      background:rgba(9, 6, 19, 0.72);
      border-radius:24px;
      border:1px solid rgba(255,230,190,0.85);
      box-shadow:
        0 0 40px rgba(0,0,0,0.85),
        0 0 30px rgba(111,177,255,0.45),
        0 0 40px rgba(255,215,170,0.55);
      padding:18px 18px 16px;
      color:#fdf7e9;
      transform-origin:top center;
      transform:scaleY(0.05);
      opacity:0;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      animation:scrollOpen 1.3s cubic-bezier(0.19,1,0.22,1) forwards;
      animation-delay:1.2s;
      animation-fill-mode:forwards;
    }
    @keyframes scrollOpen{
      0%{transform:scaleY(0.05);opacity:0;}
      60%{transform:scaleY(1.05);opacity:1;}
      80%{transform:scaleY(0.95);}
      100%{transform:scaleY(1);opacity:1;}
    }

    .scroll-bar{
      position:absolute;left:0;right:0;height:8px;
      background:linear-gradient(90deg,#f5e0b8,#fdf3cf,#f5e0b8);
      box-shadow:0 0 12px rgba(255,230,190,0.9);
    }
    .scroll-bar.top{top:8px;border-radius:999px;}
    .scroll-bar.bottom{bottom:8px;border-radius:999px;}

    .letter-title{
      font-size:17px;
      font-weight:500;
      letter-spacing:1.4px;
      margin:12px 0 6px;
      text-align:center;
      color:#ffe9c0;
      text-shadow:
        0 0 6px rgba(255,233,192,0.8),
        0 2px 4px rgba(0,0,0,0.6);
    }

    .letter-body-wrap{
      max-height:150px;
      overflow:hidden;
      padding-top:4px;
      scroll-behavior:smooth;
    }
    .letter-body{
      font-size:12px;
      line-height:1.7;
      white-space:pre-wrap;
      position:relative;
      text-shadow:0 1px 3px rgba(0,0,0,0.7);
    }

    .cursor{
      display:inline-block;
      width:2px;
      background:rgba(255,255,255,0.9);
      margin-left:2px;
      animation:caretBlink 0.8s steps(1,end) infinite;
      vertical-align:baseline;
    }
    @keyframes caretBlink{
      0%,50%{opacity:1;}
      51%,100%{opacity:0;}
    }

    .shine{
      position:absolute;top:0;left:-40%;
      width:40%;height:100%;
      background:linear-gradient(120deg,
        transparent 0%,
        rgba(255,255,255,0.6) 40%,
        rgba(255,244,214,0.95) 50%,
        rgba(255,255,255,0.6) 60%,
        transparent 100%);
      opacity:0;
      transform:skewX(-20deg);
      animation:shineSweep 1.2s ease-out forwards;
      animation-delay:1.1s;
      pointer-events:none;
    }
    @keyframes shineSweep{
      0%{left:-40%;opacity:0;}
      20%{opacity:0.9;}
      100%{left:110%;opacity:0;}
    }

    @keyframes fadeOutAll{
      to{opacity:0;visibility:hidden;}
    }

    /* GANESHA SECTION */
    .ganesha-section{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:16px;
      color:#ffeeda;
      z-index:1;
      opacity:0;
      pointer-events:none;
      transition:opacity 1s ease;
    }
    .ganesha-section.visible{
      opacity:1;
      pointer-events:auto;
    }

    .ganesha-inner{
      max-width:420px;
      width:100%;
      background:rgba(6,4,14,0.45);
      border-radius:22px;
      border:1px solid rgba(255,230,190,0.6);
      box-shadow:
        0 0 30px rgba(0,0,0,0.8),
        0 0 24px rgba(255,223,186,0.45);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      padding:14px 16px 16px;
    }

    .ganesha-gif-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:12px;
      mix-blend-mode:screen;
    }
    .ganesha-gif-wrap img{
      max-width:220px;
      width:80%;
      border-radius:18px;
      box-shadow:0 0 18px rgba(255,223,186,0.7);
    }

    .ganesha-text{
      font-size:12px;
      line-height:1.7;
      white-space:pre-wrap;
      text-shadow:0 1px 3px rgba(0,0,0,0.7);
      min-height:90px;
    }

    .g-cursor{
      display:inline-block;
      width:2px;
      background:rgba(255,255,255,0.9);
      margin-left:2px;
      animation:gCaretBlink 0.8s steps(1,end) infinite;
      vertical-align:baseline;
    }
    @keyframes gCaretBlink{
      0%,50%{opacity:1;}
      51%,100%{opacity:0;}
    }

    /* YES/NO POPUP */
    .continue-overlay{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      background:rgba(0,0,0,0.75);
      opacity:0;
      pointer-events:none;
      transition:opacity 0.6s ease;
      z-index:4;
    }
    .continue-overlay.visible{
      opacity:1;
      pointer-events:auto;
    }

    .continue-box{
      max-width:360px;
      width:100%;
      background:rgba(10,7,20,0.9);
      border-radius:18px;
      border:1px solid rgba(255,230,190,0.8);
      box-shadow:0 0 26px rgba(0,0,0,0.85);
      padding:16px 18px 18px;
      text-align:center;
      color:#ffeeda;
    }

    .continue-title{
      font-size:16px;
      margin-bottom:8px;
      letter-spacing:0.5px;
    }
    .continue-sub{
      font-size:12px;
      opacity:0.85;
      margin-bottom:14px;
    }

    .btn-row{
      display:flex;
      gap:10px;
      justify-content:center;
    }
    .btn{
      flex:1;
      padding:8px 0;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-size:13px;
      font-weight:500;
      letter-spacing:0.4px;
      transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn-yes{
      background:linear-gradient(135deg,#ffcf98,#ffdcae);
      color:#3a2308;
      box-shadow:0 0 12px rgba(255,210,150,0.7);
    }
    .btn-no{
      background:rgba(30,18,50,0.95);
      color:#ffeeda;
      border:1px solid rgba(255,230,190,0.5);
      box-shadow:0 0 12px rgba(120,90,190,0.5);
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 0 16px rgba(255,230,190,0.9);
    }
    .btn:active{
      transform:translateY(0);
      box-shadow:none;
    }

    .result-message{
      margin-top:14px;
      font-size:12px;
      line-height:1.6;
      opacity:0;
      transform:translateY(4px);
      transition:opacity 0.4s ease, transform 0.4s ease;
      white-space:pre-wrap;
    }
    .result-message.visible{
      opacity:1;
      transform:translateY(0);
    }

    /* FINAL SCENE: FULLSCREEN PHOTOS BACKGROUND + TRANSPARENT SHEET */
    .intro-layer{
      position:fixed;
      inset:0;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.7s ease;
      z-index:5;
    }
    .intro-layer.visible{
      opacity:1;
      pointer-events:auto;
    }

    .bg-slideshow{
      position:fixed;
      inset:0;
      background-color:#000;
      background-position:center;
      background-repeat:no-repeat;
      background-size:cover;
      transition:background-image 0.6s ease-in-out;
      z-index:0;
    }

    .center-sheet{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:60%;
      max-width:420px;
      min-height:120px;
      border-radius:20px;
      background:rgba(5,3,15,0.08);
      border:1px solid rgba(255,240,210,0.4);
      box-shadow:0 0 8px rgba(0,0,0,0.5);
      z-index:1;
    }

    .rk-layer-hidden{
      animation:fadeOutAll 1s ease-out forwards;
    }
  </style>
</head>
<body>
  <!-- RADHA-KRISHNA + SNOW LAYER -->
  <div id="rkLayer">
    <div class="bg-wrapper"><div class="bg-image"></div></div>
    <div class="bg-tint"></div>

    <div class="snow-layer">
      <div class="snow"></div><div class="snow"></div><div class="snow"></div><div class="snow"></div>
      <div class="snow"></div><div class="snow"></div><div class="snow"></div><div class="snow"></div>
    </div>
  </div>

  <!-- STEP 1: YT PLAYER -->
  <div class="yt-overlay" id="ytOverlay">
    <div class="yt-container">
      <iframe
        id="ytPlayer"
        class="yt-embed"
        src="https://www.youtube.com/embed/mYBqt29G9cA?autoplay=0&controls=1&rel=0&showinfo=0&enablejsapi=1&playlist=PKqVWbzMpb8,8sqDCkVgMbc,EfdUsiDcU3Q,BGSmRmIv5ws,psqZYRRb22U,AKUk1v3rBvc,cupyMQmemIg"
        title="Songs playlist"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; autoplay"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <!-- STEP 2: LETTER -->
  <div class="letter-layer" id="letterLayer">
    <div class="letter-backdrop"></div>

    <div class="letter-box">
      <div class="letter-inner">
        <div class="scroll-bar top"></div>
        <div class="scroll-bar bottom"></div>
        <div class="shine"></div>

        <div class="letter-title">
          To my dearest angel..
        </div>

        <div class="letter-body-wrap">
          <div class="letter-body" id="messageText"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- STEP 3: BAPPA -->
  <div class="ganesha-section" id="ganeshaSection">
    <div class="ganesha-inner">
      <div class="ganesha-gif-wrap">
        <img src="https://c.tenor.com/76TPk8O5M6EAAAAC/tenor.gif" alt="Ganpati Bappa">
      </div>
      <div class="ganesha-text" id="gText"></div>
    </div>
  </div>

  <!-- STEP 4: YES / NO POPUP -->
  <div class="continue-overlay" id="continueOverlay">
    <div class="continue-box">
      <div class="continue-title">Shall we continue.?</div>
      <div class="continue-sub">thodi si aur mehnat dikhau tumhe? 👀</div>
      <div class="btn-row">
        <button class="btn btn-yes" id="btnYes">Yes</button>
        <button class="btn btn-no" id="btnNo">No</button>
      </div>
      <div class="result-message" id="resultMsg"></div>
    </div>
  </div>

  <!-- STEP 5: FULLSCREEN PHOTOS BG -->
  <div class="intro-layer" id="introLayer">
    <div class="bg-slideshow" id="bgSlide"></div>
    <div class="center-sheet"></div>
  </div>

  <script>
    const fullMessage = `The dearest angel of my life,
Kabhi kabhi zindagi me kuch log aise mil jaate hain jo bina awaaz kiye, bina zyada kuch maange, dil ka ek bohot hi khaas hissa ban jaate hain.
Tum unhi logon me se ek ho. 💫
Shayad maine hamesha sahi tareeke se express nahi kiya, lekin sach ye hai ki tumhara role meri life me hamesha se bohot hi special raha hai.
Aaj bhi jab pichhle kuch mahino ko shant se dimaag me rewind karta hoon, to bohot si yaadein seedha tumse hi shuru hoti hain – chhoti chhoti baatein, simple se din, random si chats, aur woh saari conversations jo us waqt normal lagti thi, lekin aaj unhe soch kar dil me ek alag si warmth feel hoti hai.
Time ke saath priorities badal gayi, responsibilities badh gayi, hum dono apni‑apni directions me aage badhne lage… phir bhi kuch connections aise hote hain jo samay ke saath fade nahi hote, balki aur zyada quietly deepen ho jaate hain. 🌙
Shayad ab hum waise baat nahi karte, ya utna connect nahi ho pata jitna pehle hota tha, lekin iska matlab ye bilkul nahi ki un dino ki value kam ho gayi.
Un dino ki, un baaton ki, aur tumhari respect aaj bhi utni hi strong hai – shayad pehle se bhi zyada.

Ye lines likhte waqt shayad main perfect words nahi chun paaunga, lekin phir bhi ek baar dil se sab kuch seedha rakh dene ka mann hua.
Tum meri zindagi ke us hissa ka naam ho jahan sab kuch thoda zyada real, thoda zyada sincere aur thoda zyada meaningful lagta tha. 💛
Pichhe mudh kar dekhta hoon to realise hota hai ki us phase me jitni bhi growth, jitni bhi learning, jitna bhi change aaya, us sab me tumhara ek quiet sa, lekin bohot important sa hissa tha.
Shayad tumne khud kabhi uss tareeke se feel na kiya ho, lekin chahe woh simple se din ho jahan hum casually baat karte the, ya woh moments jahan tumne bina realise kiye bhi support diya – aaj woh sab cheezein mere liye bohot zyada value rakhti hain.
Zindagi apne pace se aage badh rahi hai – tum apne goals, responsibilities aur naye chapters ke saath busy ho, aur main apni direction me.
Ye sab naturally hona hi tha, aur shayad zaroori bhi tha.
Lekin iss naturally badalte hue time ke beech kuch log aise hote hain jinke liye respect kabhi kam nahi hoti; chahe conversations kam ho jaayein, chahe distances badh jaayein, phir bhi unka place dil me utna hi safe aur utna hi strong rehta hai.
Tum unhi logon me se ek ho. 🌻

Ye sab kuch kisi conclusion, kisi decision, ya kisi demand ke liye nahi likh raha.
Bas itna sa hai ki jo bhi dil me gratitude, warmth, attachment aur respect tha, usko seedhe, simple shabdon me rakh diya jaaye – bina kisi expectation ke, sirf honesty ke saath.
Thank you – un sab dino ke liye jahan tumne, shayad bina jaane, meri life ko thoda sa halka sa, thoda sa behtar bana diya.
Thank you un moments ke liye jahan tumhari presence ne cheezein sirf easy ya light nahi, balki genuinely special bana di.
Aaj bhi dil se yehi dua nikalti hai ki tumhe aage aane wale har phase me clarity mile, ache decisions milen, aise log milen jo tumhe waise hi samajh saken jaise tum deserve karti ho, aur tum hamesha apne aap par proud feel karo…
Aur agar kabhi future me kisi din, kisi chhoti si baat se tumhe meri yaad aa bhi jaaye, to bas itna sa samajhna ki kahin na kahin se ek shant si good wish – ek chhota sa, dil se nikla positive thought – tumhare naam likha गया tha. ✨

Sincerely,
Saurav`;

    const ganeshaFull = `Bahot maanti ho na tum inko…
Tumhari wajah se hi main inse pray karta tha ki sab theek rahe, tum khush raho, apni zindagi aazaadi se jiyo.
Kabhi kabhi lagta hai shayad isi wajah se unhone mujhe thoda door kar diya… 😣
Phir bhi ek cheez se genuinely khush hoon – ki tum khush ho.
Baaki aur kuch matter nahi karta.`;

    const ytOverlay = document.getElementById('ytOverlay');
    const letterLayer = document.getElementById('letterLayer');
    const container = document.getElementById('messageText');
    const ganeshaSection = document.getElementById('ganeshaSection');
    const gContainer = document.getElementById('gText');

    const chars = fullMessage.split('');
    let index = 0;
    let typingStarted = false;

    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    container.appendChild(cursor);

    const perChar = 120;

    function startTypingOnce() {
      if (typingStarted) return;
      typingStarted = true;

      letterLayer.classList.add('visible');

      setTimeout(() => {
        const interval = setInterval(() => {
          if (index >= chars.length) {
            clearInterval(interval);
            cursor.remove();

            setTimeout(() => {
              letterLayer.style.animation = 'fadeOutAll 1s ease-out forwards';
            }, 5000);

            setTimeout(() => {
              ganeshaSection.classList.add('visible');
              startGaneshaTyping();
            }, 6000);

            return;
          }

          const ch = chars[index];

          if (ch === '\n') {
            container.insertBefore(document.createElement('br'), cursor);
            container.insertBefore(document.createElement('br'), cursor);
          } else {
            container.insertBefore(document.createTextNode(ch), cursor);
          }

          container.parentElement.scrollTop = container.parentElement.scrollHeight;
          index++;
        }, perChar);
      }, 1600);
    }

    // GANESHA TYPEWRITER
    const gChars = ganeshaFull.split('');
    let gIndex = 0;
    const gCursor = document.createElement('span');
    gCursor.className = 'g-cursor';
    gContainer.appendChild(gCursor);
    const gPerChar = 90;

    function startGaneshaTyping(){
      const interval = setInterval(() => {
        if (gIndex >= gChars.length){
          clearInterval(interval);
          gCursor.remove();

          // Bappa ke baad YES/NO popup
          setTimeout(() => {
            document.getElementById('continueOverlay').classList.add('visible');
          }, 1500);
          return;
        }

        const ch = gChars[gIndex];

        if (ch === '\n'){
          gContainer.insertBefore(document.createElement('br'), gCursor);
          gContainer.insertBefore(document.createElement('br'), gCursor);
        } else {
          gContainer.insertBefore(document.createTextNode(ch), gCursor);
        }

        gIndex++;
      }, gPerChar);
    }

    let player;

    function onYouTubeIframeAPIReady(){
      player = new YT.Player('ytPlayer', {
        events:{ onStateChange: onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event){
      if (event.data === YT.PlayerState.PLAYING){
        ytOverlay.classList.add('hidden');
        setTimeout(() => {
          ytOverlay.style.display = 'none';
          startTypingOnce();
        }, 700);
      }
    }

    /* YES/NO + PHOTOS BG */
    const btnYes = document.getElementById('btnYes');
    const btnNo  = document.getElementById('btnNo');
    const result = document.getElementById('resultMsg');
    const introLayer = document.getElementById('introLayer');
    const bgSlide = document.getElementById('bgSlide');
    const continueOverlay = document.getElementById('continueOverlay');

    let currentImg = 0;

    function setBg(i){
      bgSlide.style.backgroundImage = `url('${images[i]}')`;
    }

    function startSlideshow(){
      setBg(currentImg);
      setInterval(() => {
        currentImg = (currentImg + 1) % images.length;
        setBg(currentImg);
      }, 15000);
    }

    function startFinalScene(delay){
      setTimeout(() => {
        continueOverlay.classList.remove('visible');
        rkLayer.classList.add('rk-layer-hidden');
        introLayer.classList.add('visible');
        startSlideshow();
      }, delay);
    }

    btnYes.addEventListener('click', () => {
      result.textContent = "Sirf tumhare liye kuch chhoti‑si cheezein banayi hain,\nthodi si mehnat se… dekhogi?";
      result.classList.add('visible');
      startFinalScene(2000);
    });
