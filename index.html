<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bappa + Continue + Fullscreen Pics</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{
      height:100%;width:100%;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#05040a;
      color:#ffeeda;
      overflow:hidden;
    }

    .bg{
      position:fixed;inset:0;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 55%),
        radial-gradient(circle at bottom, rgba(255,180,120,0.08), transparent 60%),
        #05040a;
      z-index:-2;
    }

    .center-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      position:relative;
      z-index:1;
    }

    .card{
      max-width:420px;
      width:100%;
      background:rgba(6,4,14,0.7);
      border-radius:22px;
      border:1px solid rgba(255,230,190,0.6);
      box-shadow:
        0 0 30px rgba(0,0,0,0.8),
        0 0 24px rgba(255,223,186,0.35);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      padding:14px 16px 16px;
      text-align:center;
    }

    .ganesha-gif-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:12px;
      mix-blend-mode:screen;
    }
    .ganesha-gif-wrap img{
      max-width:220px;
      width:80%;
      border-radius:18px;
      box-shadow:0 0 18px rgba(255,223,186,0.7);
    }

    .ganesha-text{
      font-size:13px;
      line-height:1.7;
      white-space:pre-wrap;
      text-shadow:0 1px 3px rgba(0,0,0,0.7);
      min-height:100px;
    }

    .g-cursor{
      display:inline-block;
      width:2px;
      background:rgba(255,255,255,0.9);
      margin-left:2px;
      animation:gCaretBlink 0.8s steps(1,end) infinite;
      vertical-align:baseline;
    }
    @keyframes gCaretBlink{
      0%,50%{opacity:1;}
      51%,100%{opacity:0;}
    }

    /* CONTINUE OVERLAY (popup) */
    .continue-overlay{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      background:rgba(0,0,0,0.75);
      opacity:0;
      pointer-events:none;
      transition:opacity 0.6s ease;
      z-index:3;
    }
    .continue-overlay.visible{
      opacity:1;
      pointer-events:auto;
    }

    .continue-box{
      max-width:360px;
      width:100%;
      background:rgba(10,7,20,0.9);
      border-radius:18px;
      border:1px solid rgba(255,230,190,0.8);
      box-shadow:0 0 26px rgba(0,0,0,0.85);
      padding:16px 18px 18px;
      text-align:center;
      color:#ffeeda;
    }

    .continue-title{
      font-size:16px;
      margin-bottom:8px;
      letter-spacing:0.5px;
    }
    .continue-sub{
      font-size:12px;
      opacity:0.85;
      margin-bottom:14px;
    }

    .btn-row{
      display:flex;
      gap:10px;
      justify-content:center;
    }
    .btn{
      flex:1;
      padding:8px 0;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-size:13px;
      font-weight:500;
      letter-spacing:0.4px;
      transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn-yes{
      background:linear-gradient(135deg,#ffcf98,#ffdcae);
      color:#3a2308;
      box-shadow:0 0 12px rgba(255,210,150,0.7);
    }
    .btn-no{
      background:rgba(30,18,50,0.95);
      color:#ffeeda;
      border:1px solid rgba(255,230,190,0.5);
      box-shadow:0 0 12px rgba(120,90,190,0.5);
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 0 16px rgba(255,230,190,0.9);
    }
    .btn:active{
      transform:translateY(0);
      box-shadow:none;
    }

    .result-message{
      margin-top:14px;
      font-size:12px;
      line-height:1.6;
      opacity:0;
      transform:translateY(4px);
      transition:opacity 0.4s ease, transform 0.4s ease;
      white-space:pre-wrap;
    }
    .result-message.visible{
      opacity:1;
      transform:translateY(0);
    }

    /* INTRO LAYER: fullscreen photos background + sheet */
    .intro-layer{
      position:fixed;
      inset:0;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.7s ease;
      z-index:4;
    }
    .intro-layer.visible{
      opacity:1;
      pointer-events:auto;
    }

    .intro-bg{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      transition:background-image 0.6s ease-in-out;
      z-index:0;
    }

    .circle-letter{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:60%;
      max-width:420px;
      min-height:120px;
      border-radius:20px;
      /* aur zyada transparent */
      background:rgba(5,3,15,0.18);
      border:1px solid rgba(255,240,210,0.6);
      box-shadow:
        0 0 14px rgba(0,0,0,0.6),
        0 0 12px rgba(255,220,180,0.4);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      z-index:1;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <!-- STEP 1: BAPPA CARD (pura old scene) -->
  <div class="center-wrap">
    <div class="card">
      <div class="ganesha-gif-wrap">
        <img src="https://c.tenor.com/76TPk8O5M6EAAAAC/tenor.gif" alt="Ganpati Bappa">
      </div>
      <div class="ganesha-text" id="gText"></div>
    </div>
  </div>

  <!-- STEP 2: CONTINUE POPUP (YES/NO) -->
  <div class="continue-overlay" id="continueOverlay">
    <div class="continue-box">
      <div class="continue-title">Shall we continue.?</div>
      <div class="continue-sub">thodi si aur mehnat dikhau tumhe? 👀</div>
      <div class="btn-row">
        <button class="btn btn-yes" id="btnYes">Yes</button>
        <button class="btn btn-no" id="btnNo">No</button>
      </div>
      <div class="result-message" id="resultMsg"></div>
    </div>
  </div>

  <!-- STEP 3: FULLSCREEN PHOTOS BACKGROUND + TRANSPARENT SHEET -->
  <div class="intro-layer" id="introLayer">
    <div class="intro-bg" id="introBg"></div>
    <div class="circle-letter"></div>
  </div>

  <script>
    /* ====== BAPPA TYPING (unchanged) ====== */
    const ganeshaFull = `Bahot maanti ho na tum inko…
Tumhari wajah se hi main inse pray karta tha ki sab theek rahe, tum khush raho, apni zindagi aazaadi se jiyo.
Kabhi kabhi lagta hai shayad isi wajah se unhone mujhe thoda door kar diya… 😣
Phir bhi ek cheez se genuinely khush hoon – ki tum khush ho.
Baaki aur kuch matter nahi karta.`;

    const gContainer = document.getElementById('gText');
    const gChars = ganeshaFull.split('');
    let gIndex = 0;
    const gCursor = document.createElement('span');
    gCursor.className = 'g-cursor';
    gContainer.appendChild(gCursor);
    const gPerChar = 90;

    function startGaneshaTyping(){
      const interval = setInterval(() => {
        if (gIndex >= gChars.length){
          clearInterval(interval);
          gCursor.remove();

          // 5s baad YES/NO popup
          setTimeout(() => {
            document.getElementById('continueOverlay').classList.add('visible');
          }, 5000);

          return;
        }

        const ch = gChars[gIndex];

        if (ch === '\n'){
          gContainer.insertBefore(document.createElement('br'), gCursor);
          gContainer.insertBefore(document.createElement('br'), gCursor);
        } else {
          gContainer.insertBefore(document.createTextNode(ch), gCursor);
        }

        gIndex++;
      }, gPerChar);
    }

    window.addEventListener('load', startGaneshaTyping);

    /* ====== YES / NO + FULLSCREEN PHOTOS ====== */
    const btnYes = document.getElementById('btnYes');
    const btnNo  = document.getElementById('btnNo');
    const result = document.getElementById('resultMsg');
    const introLayer = document.getElementById('introLayer');
    const introBg = document.getElementById('introBg');
    const continueOverlay = document.getElementById('continueOverlay');

    // Tumhari saari unique pics (HD slideshow)

    let currentImg = 0;

    function setBg(i){
      introBg.style.backgroundImage = `url('${images[i]}')`;
    }

    function startSlideshow(){
      setBg(currentImg);
      setInterval(() => {
        currentImg = (currentImg + 1) % images.length;
        setBg(currentImg);
      }, 15000);
    }

    function showIntroAfterMessage(delay){
      setTimeout(() => {
        continueOverlay.classList.remove('visible');
        introLayer.classList.add('visible');
        startSlideshow() ;
      }, delay);
    }

    btnYes.addEventListener('click', () => {
      result.textContent = "Sirf tumhare liye kuch chhoti‑si cheezein banayi hain,\nthodi si mehnat se… dekhogi?";
      result.classList.add('visible');
      showIntroAfterMessage(2000);
    });

    btnNo.addEventListener('click', () => {
      result.textContent = "Kitne bigdail ho yrr tum…\nitni mehnat se banayi hui cheez ko koi aise mana karta hai kya? Ab dekho nahi toh katti. 😤";
      result.classList.add('visible');
      showIntroAfterMessage(2500);
    });
  </script>
</body>
</html>
