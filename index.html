  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{
      html,body{
  height:100%;width:100%;overflow:hidden;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    url("https://scontent.fpat2-8.fna.fbcdn.net/v/t1.15752-9/622471357_1975604193390615_8500902659735836688_n.jpg?stp=dst-jpg_s960x960_tt6&_nc_cat=103&ccb=1-7&_nc_sid=9f807c&_nc_ohc=1puwxfqj-RIQ7kNvwHGls5j&_nc_oc=Adn_B8wayDTXqrGvTylzjgVacxh_wFrZJRO7iioL2nucJ4-pZDyc2VsMcSVYqQrcDUH4nxgfJtAK2Yts3fndRv3x&_nc_zt=23&_nc_ht=scontent.fpat2-8.fna&oh=03_Q7cD4gHB9EfJVUhUukAz7ZBpgUAdLr_JQ7LEvEWLvcsOueVQJA&oe=69A945ED") center/cover no-repeat,
    radial-gradient(circle at center,
      rgba(0,0,0,0.18) 0%,
      rgba(0,0,0,0.48) 55%,
      rgba(0,0,0,0.8) 100%);
  background-blend-mode:darken;
  position:relative;
}


    /* SNOWFALL (SMALL, DIM BALLS) */
    .snow-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}
.flake{
  position:absolute;
  top:-8%;
  --size:6px;
  width:var(--size);
  height:var(--size);
  border-radius:50%;
  background:rgba(255,255,255,0.35);
  opacity:0.9;
  animation:flakeFall linear infinite;
}
.flake:nth-child(1){left:8%;  --size:5px; animation-duration:14s; animation-delay:0s;}
.flake:nth-child(2){left:22%; --size:6px; animation-duration:18s; animation-delay:1s;}
.flake:nth-child(3){left:36%; --size:4px; animation-duration:16s; animation-delay:0.5s;}
.flake:nth-child(4){left:50%; --size:7px; animation-duration:19s; animation-delay:1.8s;}
.flake:nth-child(5){left:64%; --size:5px; animation-duration:17s; animation-delay:0.9s;}
.flake:nth-child(6){left:78%; --size:6px; animation-duration:20s; animation-delay:1.3s;}
.flake:nth-child(7){left:92%; --size:4px; animation-duration:18s; animation-delay:0.7s;}

@keyframes flakeFall{
  0%{transform:translate3d(0,0,0);opacity:0;}
  10%{opacity:0.8;}
  50%{transform:translate3d(-8px,50vh,0);}
  100%{transform:translate3d(8px,105vh,0);opacity:0;}
}

    /* YOUTUBE OVERLAY */
    .yt-overlay{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      z-index:3;
      transition:opacity 0.7s ease;
      background:none;
    }
    .yt-overlay.hidden{
      opacity:0;
      pointer-events:none;
    }
    .yt-container{
      width:90vw;
      max-width:420px;
      aspect-ratio:16/9;
      box-shadow:0 0 30px rgba(0,0,0,0.85);
      border-radius:18px;
      overflow:hidden;
      background:#000;
    }
    .yt-embed{
      width:100%;height:100%;border:0;
    }

    /* LETTER LAYER (MAIN LONG LETTER) */
    .letter-layer{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      z-index:2;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.8s ease;
    }
    .letter-layer.visible{
      opacity:1;
      pointer-events:auto;
    }
    .letter-backdrop{
      position:fixed;inset:0;
      background:transparent;
    }
    .letter-box{
      position:relative;
      min-width:260px;
      max-width:460px;
      border-radius:24px;
      background:transparent;
      perspective:1200px;
      transform:scale(0.7);
      opacity:0;
      animation:letterBoxIn 1s cubic-bezier(0.19,1,0.22,1) forwards;
      animation-delay:0.8s;
      z-index:1;
      animation-fill-mode:forwards;
      transition:transform 0.6s ease, box-shadow 0.6s ease;
    }
    @keyframes letterBoxIn{
      0%{transform:scale(0.7);opacity:0;}
      60%{transform:scale(1.03);opacity:1;}
      100%{transform:scale(0.96);opacity:1;}
    }
    @media (hover:hover){
      .letter-box:hover{
        transform:scale(0.73);
        box-shadow:0 0 45px rgba(255,245,220,0.45);
      }
    }
    .letter-inner{
      position:relative;
      background:rgba(9, 6, 19, 0.72);
      border-radius:24px;
      border:1px solid rgba(255,230,190,0.85);
      box-shadow:
        0 0 40px rgba(0,0,0,0.85),
        0 0 30px rgba(111,177,255,0.45),
        0 0 40px rgba(255,215,170,0.55);
      padding:18px 18px 16px;
      color:#fdf7e9;
      transform-origin:top center;
      transform:scaleY(0.05);
      opacity:0;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      animation:scrollOpen 1.3s cubic-bezier(0.19,1,0.22,1) forwards;
      animation-delay:1.2s;
      animation-fill-mode:forwards;
    }
    @keyframes scrollOpen{
      0%{transform:scaleY(0.05);opacity:0;}
      60%{transform:scaleY(1.05);opacity:1;}
      80%{transform:scaleY(0.95);}
      100%{transform:scaleY(1);opacity:1;}
    }
    .scroll-bar{
      position:absolute;left:0;right:0;height:8px;
      background:linear-gradient(90deg,#f5e0b8,#fdf3cf,#f5e0b8);
      box-shadow:0 0 12px rgba(255,230,190,0.9);
    }
    .scroll-bar.top{top:8px;border-radius:999px;}
    .scroll-bar.bottom{bottom:8px;border-radius:999px;}
    .letter-title{
      font-size:17px;
      font-weight:500;
      letter-spacing:1.4px;
      margin:12px 0 6px;
      text-align:center;
      color:#ffe9c0;
      text-shadow:
        0 0 6px rgba(255,233,192,0.8),
        0 2px 4px rgba(0,0,0,0.6);
    }
    .letter-body-wrap{
      max-height:150px;
      overflow:hidden;
      padding-top:4px;
      scroll-behavior:smooth;
    }
    .letter-body{
      font-size:12px;
      line-height:1.7;
      white-space:pre-wrap;
      position:relative;
      text-shadow:0 1px 3px rgba(0,0,0,0.7);
    }
    .cursor{
      display:inline-block;
      width:2px;
      background:rgba(255,255,255,0.9);
      margin-left:2px;
      animation:caretBlink 0.8s steps(1,end) infinite;
      vertical-align:baseline;
    }
    @keyframes caretBlink{
      0%,50%{opacity:1;}
      51%,100%{opacity:0;}
    }
    .shine{
      position:absolute;top:0;left:-40%;
      width:40%;height:100%;
      background:linear-gradient(120deg,
        transparent 0%,
        rgba(255,255,255,0.6) 40%,
        rgba(255,244,214,0.95) 50%,
        rgba(255,255,255,0.6) 60%,
        transparent 100%);
      opacity:0;
      transform:skewX(-20deg);
      animation:shineSweep 1.2s ease-out forwards;
      animation-delay:1.1s;
      pointer-events:none;
    }
    @keyframes shineSweep{
      0%{left:-40%;opacity:0;}
      20%{opacity:0.9;}
      100%{left:110%;opacity:0;}
    }

    /* GANESHA SECTION */
    .ganesha-section{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:16px;
      color:#ffeeda;
      z-index:1;
      opacity:0;
      pointer-events:none;
      transition:opacity 1s ease;
    }
    .ganesha-section.visible{
      opacity:1;
      pointer-events:auto;
    }
    .ganesha-inner{
      max-width:420px;
      width:100%;
      background:rgba(6,4,14,0.45);
      border-radius:22px;
      border:1px solid rgba(255,230,190,0.6);
      box-shadow:
        0 0 30px rgba(0,0,0,0.8),
        0 0 24px rgba(255,223,186,0.45);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      padding:14px 16px 16px;
    }
    .ganesha-gif-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:12px;
      mix-blend-mode:screen;
    }
    .ganesha-gif-wrap img{
      max-width:220px;
      width:80%;
      border-radius:18px;
      box-shadow:0 0 18px rgba(255,223,186,0.7);
    }
    .ganesha-text{
      font-size:12px;
      line-height:1.7;
      white-space:pre-wrap;
      text-shadow:0 1px 3px rgba(0,0,0,0.7);
      min-height:90px;
    }
    .g-cursor{
      display:inline-block;
      width:2px;
      background:rgba(255,255,255,0.9);
      margin-left:2px;
      animation:gCaretBlink 0.8s steps(1,end) infinite;
      vertical-align:baseline;
    }
    @keyframes gCaretBlink{
      0%,50%{opacity:1;}
      51%,100%{opacity:0;}
    }

    /* YES/NO POPUP */
    .continue-overlay{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      background:rgba(0,0,0,0.75);
      opacity:0;
      pointer-events:none;
      transition:opacity 0.6s ease;
      z-index:4;
    }
    .continue-overlay.visible{
      opacity:1;
      pointer-events:auto;
    }
    .continue-box{
      max-width:360px;
      width:100%;
      background:rgba(10,7,20,0.9);
      border-radius:18px;
      border:1px solid rgba(255,230,190,0.8);
      box-shadow:0 0 26px rgba(0,0,0,0.85);
      padding:16px 18px 18px;
      text-align:center;
      color:#ffeeda;
    }
    .continue-title{
      font-size:16px;
      margin-bottom:8px;
      letter-spacing:0.5px;
    }
    .continue-sub{
      font-size:12px;
      opacity:0.85;
      margin-bottom:14px;
    }
    .btn-row{
      display:flex;
      gap:10px;
      justify-content:center;
    }
    .btn{
      flex:1;
      padding:8px 0;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-size:13px;
      font-weight:500;
      letter-spacing:0.4px;
      transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn-yes{
      background:linear-gradient(135deg,#ffcf98,#ffdcae);
      color:#3a2308;
      box-shadow:0 0 12px rgba(255,210,150,0.7);
    }
    .btn-no{
      background:rgba(30,18,50,0.95);
      color:#ffeeda;
      border:1px solid rgba(255,230,190,0.5);
      box-shadow:0 0 12px rgba(120,90,190,0.5);
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 0 16px rgba(255,230,190,0.9);
    }
    .btn:active{
      transform:translateY(0);
      box-shadow:none;
    }
    .result-message{
      margin-top:14px;
      font-size:12px;
      line-height:1.6;
      opacity:0;
      transform:translateY(4px);
      transition:opacity 0.4s ease, transform 0.4s ease;
      white-space:pre-wrap;
    }
    .result-message.visible{
      opacity:1;
      transform:translateY(0);
    }

    /* DOUBLE SHEET SECTION */
    .double-sheet-section{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:2;
      opacity:0;
      pointer-events:none;
      transition:opacity 1s ease;
    }
    .double-sheet-section.visible{
      opacity:1;
      pointer-events:auto;
    }
    .double-sheet-wrapper{
      display:flex;
      gap:14px;
      max-width:520px;
      width:100%;
      padding:0 16px;
      position:relative;
    }
    .sheet{
      flex:1;
      border-radius:22px;
      background:rgba(9,6,19,0.55);
      border:1px solid rgba(255,230,190,0.85);
      box-shadow:
        0 0 26px rgba(0,0,0,0.85),
        0 0 24px rgba(255,215,170,0.45);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      padding:14px 14px 16px;
      position:relative;
      overflow:hidden;
    }
    .sheet-left{flex:1;}
    .sheet-right{flex:1;}

    .image-title{
      font-size:13px;
      font-weight:600;
      letter-spacing:0.6px;
      text-align:center;
      color:#ffffff;
      margin-bottom:6px;
      text-shadow:0 1px 4px rgba(0,0,0,0.9);
    }
    .sheet-title{
      font-size:13px;
      font-weight:600;
      letter-spacing:0.8px;
      text-align:center;
      color:#ffe9c0;
      margin-bottom:6px;
      text-shadow:0 1px 4px rgba(0,0,0,0.9);
    }

    .sheet-left-inner{
      position:relative;
      width:100%;
      height:220px;
      border-radius:18px;
      overflow:hidden;
    }
    .slide-full{
      position:absolute;
      inset:0;
      background-position:center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      transition:opacity 0.9s ease;
    }
    .slide-full.active{
      opacity:1;
    }

    .sheet-text-wrap{
      max-height:210px;
      overflow:auto;
      margin-top:4px;
      padding-right:4px;
    }
    .sheet-text{
      font-size:12px;
      line-height:1.7;
      white-space:pre-wrap;
      color:#fdf7e9;
    }
    .sheet-cursor{
      display:inline-block;
      width:2px;
      background:rgba(255,255,255,0.9);
      margin-left:2px;
      animation:caretBlink 0.8s steps(1,end) infinite;
      vertical-align:baseline;
    }

    .finger-left,
    .finger-right{
      position:absolute;
      font-size:26px;
      text-shadow:0 2px 4px rgba(0,0,0,0.9);
      pointer-events:none;
      opacity:0.95;
      color:#ffffff;
    }
    .finger-left{
      bottom:100%;
      left:8%;
      margin-bottom:2px;
    }
    .finger-right{
      bottom:100%;
      right:8%;
      margin-bottom:2px;
    }

    /* FINAL GIF CARD */
    .final-card{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:6;
      opacity:0;
      pointer-events:none;
      transition:opacity 1s ease;
      background:transparent;
    }
    .final-card.visible{
      opacity:1;
      pointer-events:auto;
    }
    .final-card-inner{
      max-width:360px;
      width:100%;
      background:rgba(9,6,19,0.65);
      border-radius:22px;
      border:1px solid rgba(255,230,190,0.9);
      box-shadow:
        0 0 30px rgba(0,0,0,0.85),
        0 0 26px rgba(255,215,170,0.55);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      padding:16px 16px 14px;
      text-align:center;
      color:#ffeeda;
    }
    .final-gif-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:12px;
    }
    .final-gif-wrap img{
      max-width:200px;
      width:80%;
      border-radius:18px;
      box-shadow:0 0 16px rgba(255,223,186,0.8);
    }
    .final-text{
      font-size:13px;
      line-height:1.7;
      white-space:pre-wrap;
      text-shadow:0 1px 3px rgba(0,0,0,0.7);
    }

    /* FOOTER INSTA LINK */
    .footer-insta{
      position:fixed;
      left:0;right:0;
      bottom:6px;
      text-align:center;
      font-size:11px;
      color:#ffeeda;
      opacity:0.9;
      z-index:7;
      text-shadow:0 1px 3px rgba(0,0,0,0.8);
    }
    .footer-insta a{
      color:#ffd9a3;
      text-decoration:none;
      font-weight:500;
    }
    .footer-insta a:hover{
      text-decoration:underline;
    }
  </style>
</head>

    const fullMessage = `The dearest angel of my life,
Kabhi kabhi zindagi me kuch log aise mil jaate hain jo bina awaaz kiye, bina zyada kuch maange, dil ka ek bohot hi khaas hissa ban jaate hain.
Tum unhi logon me se ek ho. 💫

Aaj bhi jab pichhle kuch mahino ko shant se dimaag me rewind karta hoon, to bohot si yaadein seedha tumse hi shuru hoti hain – chhoti chhoti baatein, simple se din, random si chats, aur woh saari conversations jo us waqt normal lagti thi, lekin aaj unhe soch kar dil me ek alag si warmth feel hoti hai.

Shayad ab hum waise baat nahi karte, ya utna connect nahi ho pata jitna pehle hota tha, lekin iska matlab ye bilkul nahi ki un dino ki value kam ho gayi.
Un dino ki, un baaton ki, aur tumhari respect aaj bhi utni hi strong hai – shayad pehle se bhi zyada.

Ye lines likhte waqt shayad main perfect words nahi chun paaunga, lekin phir bhi ek baar dil se sab kuch seedha rakh dene ka mann hua.
Tum meri zindagi ke us hissa ka naam ho jahan sab kuch thoda zyada real, thoda zyada sincere aur thoda zyada meaningful lagta tha. 💛
Pichhe mudh kar dekhta hoon to realise hota hai ki us phase me jitni bhi growth, jitni bhi learning, jitna bhi change aaya, us sab me tumhara ek quiet sa, lekin bohot important sa hissa tha.
Shayad tumne khud kabhi uss tareeke se feel na kiya ho, lekin chahe woh simple se din ho jahan hum casually baat karte the, ya woh moments jahan tumne bina realise kiye bhi support diya – aaj woh sab cheezein mere liye bohot zyada value rakhti hain.

    const messageEl = document.getElementById('messageText');
    const sheetEl   = document.getElementById('sheetText');
    const gEl       = document.getElementById('gText');

    const letterLayer        = document.getElementById('letterLayer');
    const ganeshaSection     = document.getElementById('ganeshaSection');
    const continueOverlay    = document.getElementById('continueOverlay');
    const doubleSheetSection = document.getElementById('doubleSheetSection');
    const finalCard          = document.getElementById('finalCard');

    const ytOverlay = document.getElementById('ytOverlay');

    const btnYes = document.getElementById('btnYes');
    const btnNo  = document.getElementById('btnNo');
    const resultMsg = document.getElementById('resultMsg');

    /* LEFT SLIDESHOW IMAGES */
    const slideUrls = [
      "https://i.ibb.co/89ZkZ9Q/Whats-App-Image-2025-02-02-at-22-17-43-2a44a4cd.jpg",
      "https://i.ibb.co/89ZkZ9Q/Whats-App-Image-2025-02-02-at-22-17-43-2a44a4cd.jpg",
      "https://i.ibb.co/89ZkZ9Q/Whats-App-Image-2025-02-02-at-22-17-43-2a44a4cd.jpg"
    ];
    const leftContainer = document.getElementById('leftSlideshow');

    function setupSlides(){
      slideUrls.forEach((url,idx)=>{
        const d=document.createElement('div');
        d.className='slide-full'+(idx===0?' active':'');
        d.style.backgroundImage=`url("${url}")`;
        leftContainer.appendChild(d);
      });
      const slides=document.querySelectorAll('.slide-full');
      let current=0;
      setInterval(()=>{
        slides[current].classList.remove('active');
        current=(current+1)%slides.length;
        slides[current].classList.add('active');
      },15000);
    }

    function typeText(el, text, speed=25, done){
      let i=0;
      el.textContent='';
      const cursor=document.createElement('span');
      cursor.className= el.id==='gText' ? 'g-cursor' : (el.id==='sheetText' ? 'sheet-cursor' : 'cursor');
      el.appendChild(cursor);
      const interval=setInterval(()=>{
        if(i<text.length){
          cursor.before(text.charAt(i));
          i++;
        }else{
          clearInterval(interval);
          if(done) done();
        }
      },speed);
    }

    setTimeout(()=>{
