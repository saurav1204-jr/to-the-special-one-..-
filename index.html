    .snow:nth-child(17){left:83%;animation-duration:11s;animation-delay:0.6s;}
    .snow:nth-child(18){left:88%;animation-duration:13s;animation-delay:1.6s;}
    .snow:nth-child(19){left:93%;animation-duration:15s;animation-delay:2.6s;}

    @keyframes fall{
      0%{transform:translate3d(0,0,0) scale(1);opacity:0;}
      10%{opacity:1;}

      100%{transform:translate3d(10px,105vh,0) scale(0.9);opacity:0;}

    /* COMMON FADE OUT EFFECT FOR LAYERS */
    .fade-out-soft{
      animation: fadeOutSoft 1.2s ease forwards;
    }
    @keyframes fadeOutSoft{
      0%{opacity:1;}
      100%{opacity:0;visibility:hidden;}
    }

    /* YOUTUBE OVERLAY */
    .yt-overlay{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      z-index:3;
      transition:opacity 0.7s ease;
      background:none;
    }
    .yt-overlay.hidden{
      opacity:0;
      pointer-events:none;
    }
    .yt-container{
      width:90vw;
      max-width:420px;

      box-shadow:0 0 30px rgba(0,0,0,0.85);
      border-radius:18px;
      overflow:hidden;
      background:#000;
    }
    .yt-embed{
      width:100%;height:100%;border:0;
    }

    /* LETTER LAYER */
    .letter-layer{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      z-index:2;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.8s ease;
    }
    .letter-layer.visible{
      opacity:1;
      pointer-events:auto;
    }
    .letter-backdrop{
      position:fixed;inset:0;
      background:transparent;
    }
    .letter-box{
      position:relative;
      min-width:260px;
      max-width:460px;
      border-radius:24px;
      background:transparent;
      perspective:1200px;
      transform:scale(0.7);
      opacity:0;
      animation:letterBoxIn 1s cubic-bezier(0.19,1,0.22,1) forwards;
      animation-delay:0.8s;
      z-index:1;
      animation-fill-mode:forwards;
      transition:transform 0.6s ease, box-shadow 0.6s ease;
    }
    @keyframes letterBoxIn{
      0%{transform:scale(0.7);opacity:0;}
      60%{transform:scale(1.03);opacity:1;}
      100%{transform:scale(0.96);opacity:1;}

        transform:scale(0.73);
        box-shadow:0 0 45px rgba(255,245,220,0.45);
      }

      background:rgba(9, 6, 19, 0.72);

      opacity:0;

      animation:scrollOpen 1.3s cubic-bezier(0.19,1,0.22,1) forwards;
      animation-delay:1.2s;
      animation-fill-mode:forwards;
    }
    @keyframes scrollOpen{

      60%{transform:scaleY(1.05);opacity:1;}
      80%{transform:scaleY(0.95);}
      100%{transform:scaleY(1);opacity:1;}

      animation-delay:1.1s;
      pointer-events:none;

    .btn:active{

    }
    .result-message{

      line-height:1.6;

    }
    .result-message.visible{
      opacity:1;
      transform:translateY(0);

    /* DOUBLE TRANSPARENT SHEETS (AFTER POPUP) */

    .sheet{
      flex:1;

      font-size:13px;
      color:#ffffff;
      text-shadow:0 1px 3px rgba(0,0,0,0.9);
      white-space:nowrap;
    }
  </style>

    const leftContainer = document.getElementById('leftSlideshow');

    function setupSlides(){
      slideUrls.forEach((url,idx)=>{
        const d=document.createElement('div');

        d.style.backgroundImage=`url("${url}")`;
        leftContainer.appendChild(d);

      const slides=document.querySelectorAll('.slide-full');
      if(slides.length===0) return;
      let current=0;
      setInterval(()=>{
        slides[current].classList.remove('active');
        current=(current+1)%slides.length;
        slides[current].classList.add('active');
      },10000); // 10 seconds per slide [web:286][web:66]
    }
